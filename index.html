<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Afiyet Döner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--p:#E85D04;--pd:#C2410C;--bg:#FAF7F2;--c:#FFF;--t:#1A1A1A;--m:#6B6560;--b:#EDE8E1;--r:20px;--s:0 4px 20px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,sans-serif}
body{background:var(--bg);color:var(--t);padding-bottom:90px;overflow-x:hidden}
@keyframes f{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes s{from{transform:translateY(100%)}to{transform:translateY(0)}}
.screen{display:none}.screen.active{display:block;animation:f .4s ease forwards}
.hero{background:linear-gradient(145deg,var(--p),var(--pd));color:#fff;padding:25px 20px 35px;border-radius:0 0 30px 30px;box-shadow:0 10px 30px rgba(232,93,4,.2)}
.hero h1{font-size:26px;font-weight:800}
.cats{display:flex;gap:10px;padding:20px 16px 10px;overflow-x:auto;scrollbar-width:none}
.cat{flex-shrink:0;padding:12px 20px;border-radius:26px;border:1.5px solid var(--b);background:var(--c);font-size:14px;font-weight:700;color:var(--m);cursor:pointer;transition:.3s}
.cat.on{background:var(--p);color:#fff;border-color:var(--p);transform:scale(1.05);box-shadow:0 4px 15px rgba(232,93,4,.3)}
.list{padding:10px 16px 20px;display:grid;gap:16px}
.card{background:var(--c);border-radius:var(--r);padding:12px;display:flex;gap:14px;box-shadow:var(--s);border:1px solid var(--b);animation:f .4s ease backwards;align-items:center;transition:transform .2s}
.card img{width:105px;height:105px;border-radius:16px;object-fit:cover}
.cb{flex:1;display:flex;flex-direction:column;justify-content:space-between;height:105px;padding:4px 0}
.cn{font-size:17px;font-weight:800}
.cd{font-size:12px;color:var(--m);line-height:1.4;margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:17px;font-weight:900;color:var(--p)}
.plus{width:40px;height:40px;border-radius:50%;border:none;background:var(--p);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(232,93,4,.4)}
.cart-row{background:var(--c);border-radius:var(--r);padding:16px;display:flex;gap:14px;box-shadow:var(--s);margin-bottom:12px;align-items:center}
.qb{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--b);background:var(--bg);font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer}
.up{margin:0 16px 16px;padding:18px;background:#FFF7ED;border-radius:var(--r);border:2px dashed var(--p)}
.upt{font-size:14px;font-weight:800;color:var(--p);margin-bottom:12px}
.upi{display:flex;align-items:center;gap:14px;background:#fff;padding:12px;border-radius:16px;box-shadow:var(--s)}
.uimg{width:60px;height:60px;border-radius:12px;object-fit:cover}
.upa{margin-left:auto;background:var(--p);color:#fff;border:none;padding:10px 16px;border-radius:22px;font-size:14px;font-weight:800;cursor:pointer}
.form{padding:20px 16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--m);margin-bottom:8px;text-transform:uppercase}
.field input,.field textarea{width:100%;padding:16px;border:1.5px solid var(--b);border-radius:16px;font-size:16px;outline:none;background:var(--c)}
.btn{width:100%;background:var(--p);color:#fff;border:none;padding:18px;border-radius:18px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(232,93,4,.3)}
.ph{background:linear-gradient(145deg,var(--p),var(--pd));color:#fff;padding:35px 20px;border-radius:0 0 30px 30px;text-align:center}
.av{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 15px;border:3px solid rgba(255,255,255,.4)}
.mr{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--b);cursor:pointer;background:var(--c)}
.mi{font-size:22px;margin-right:16px}
.nav{position:fixed;bottom:0;width:100%;height:80px;background:rgba(255,255,255,.85);backdrop-filter:blur(15px);border-top:1px solid rgba(0,0,0,.05);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:none;background:none;color:var(--m);font-size:11px;font-weight:700;cursor:pointer;transition:.2s}
.ni.on{color:var(--p);transform:translateY(-2px)}
.nicon{font-size:24px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal.show{display:flex}
.mbox{background:#fff;padding:25px 20px 35px;border-radius:30px 30px 0 0;width:100%;animation:s .3s ease;max-height:90vh;overflow-y:auto}
.ai{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--b)}
.eb{background:#FEF3C7;color:#B45309;border:none;padding:8px 14px;border-radius:12px;font-weight:800;cursor:pointer}
.db{background:#FEE2E2;color:#B91C1C;border:none;padding:8px 14px;border-radius:12px;font-weight:800;cursor:pointer}
.success{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;text-align:center;padding:20px}
.sicon{font-size:80px;margin-bottom:20px}
</style>
</head>
<body>
<div id="s-menu" class="screen active">
<div class="hero"><h1>Afiyet Döner</h1><p style="opacity:.85;font-size:14px;margin-top:6px">Халяль · 9:00 – 00:00</p></div>
<div class="cats" id="cats"></div>
<div class="list" id="menu-list"></div>
</div>
<div id="s-cart" class="screen">
<div class="hero" style="padding:20px;border-radius:0 0 24px 24px"><h1 style="font-size:20px">Ваш заказ</h1></div>
<div class="list" id="cart-list"></div>
<div id="upsell"></div>
<div style="padding:16px">
<div style="display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin-bottom:20px"><span>Итого:</span><span id="total" style="color:var(--p)">0 сум</span></div>
<button class="btn" onclick="checkout()">Оформить заказ</button>
</div>
</div>
<div id="s-checkout" class="screen">
<div class="hero" style="padding:20px;border-radius:0 0 24px 24px"><h1 style="font-size:20px">Куда доставить?</h1></div>
<div class="form">
<div class="field"><label>Имя</label><input type="text" id="o-name"></div>
<div class="field"><label>Телефон</label><input type="tel" id="o-phone"></div>
<div class="field"><label>Адрес</label><textarea id="o-addr" rows="2"></textarea></div>
<button class="btn" onclick="submitOrder()">Подтвердить заказ</button>
</div>
</div>
<div id="s-success" class="screen">
<div class="success">
<div class="sicon">🎉</div>
<h1 style="font-size:28px;font-weight:900;margin-bottom:10px">Заказ принят!</h1>
<p style="color:var(--m);font-size:16px;margin-bottom:30px">Мы уже начали готовить.</p>
<button class="btn" style="max-width:250px" onclick="go('menu')">Вернуться в меню</button>
</div>
</div>
<div id="s-profile" class="screen">
<div class="ph">
<div class="av" id="p-av">👤</div>
<div style="font-size:24px;font-weight:900" id="p-name">Гость</div>
<div style="font-size:15px;opacity:.9;margin-top:6px" id="p-phone">Укажите номер</div>
</div>
<div style="margin-top:25px;background:var(--c);border-top:1px solid var(--b)">
<div class="mr" onclick="editProfile()"><span class="mi">✏️</span><span style="font-weight:700">Редактировать профиль</span></div>
<div class="mr" style="justify-content:center;padding:35px;opacity:.3" onclick="openAdmin()"><span style="font-size:12px;font-weight:600">⚙️ Для сотрудников</span></div>
</div>
</div>
<div id="s-admin" class="screen">
<div class="hero" style="padding:20px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 24px 24px">
<h1 style="font-size:20px">Админ-панель</h1>
<button onclick="go('profile')" style="background:none;border:none;color:#fff;font-size:24px">✕</button>
</div>
<div class="list">
<div style="display:flex;gap:10px;margin-bottom:10px">
<button class="btn" style="flex:1;padding:14px;font-size:15px" onclick="switchTab('orders')">Заказы</button>
<button class="btn" style="flex:1;padding:14px;font-size:15px;background:#fff;color:#1A1A1A;border:1px solid var(--b)" onclick="switchTab('menu')">Меню</button>
</div>
<div id="admin-orders"></div>
<div id="admin-menu" style="display:none"></div>
</div>
</div>
<div id="pass-modal" class="modal"><div class="mbox" style="text-align:center">
<h2 style="margin-bottom:20px">Вход для Админа</h2>
<input type="password" id="pass" placeholder="Пароль" style="width:100%;padding:16px;border:2px solid var(--b);border-radius:16px;font-size:18px;text-align:center;margin-bottom:20px;outline:none">
<button class="btn" onclick="checkPass()">Войти</button>
<button style="background:none;border:none;color:var(--m);margin-top:20px;font-size:15px;font-weight:700" onclick="document.getElementById('pass-modal').classList.remove('show')">Отмена</button>
</div></div>
<div id="edit-modal" class="modal"><div class="mbox">
<h2 style="margin-bottom:20px;text-align:center">Блюдо</h2>
<div class="field"><label>Категория</label><input type="text" id="e-cat"></div>
<div class="field"><label>Название</label><input type="text" id="e-name"></div>
<div class="field"><label>Описание</label><input type="text" id="e-desc"></div>
<div class="field"><label>Цена</label><input type="number" id="e-price"></div>
<div class="field"><label>Фото</label><input type="text" id="e-img"></div>
<input type="hidden" id="e-id">
<button class="btn" onclick="saveItem()">Сохранить</button>
</div></div>
<div id="prof-modal" class="modal"><div class="mbox">
<h2 style="margin-bottom:20px;text-align:center">Мои данные</h2>
<div class="field"><label>Имя</label><input type="text" id="u-name"></div>
<div class="field"><label>Телефон</label><input type="tel" id="u-phone"></div>
<div class="field"><label>Адрес</label><input type="text" id="u-addr"></div>
<button class="btn" onclick="saveProf()">Сохранить</button>
</div></div>
<nav class="nav" id="nav">
<button class="ni on" data-tab="menu" onclick="go('menu')"><span class="nicon">🍽</span>Меню</button>
<button class="ni" data-tab="cart" onclick="go('cart')"><span class="nicon">🛒</span>Корзина</button>
<button class="ni" data-tab="profile" onclick="go('profile')"><span class="nicon">👤</span>Профиль</button>
</nav>
<script>
let cart={},menuData={},cat='',prof=JSON.parse(localStorage.getItem('prof'))||{name:'',phone:'',address:''};
const PASS="Afiyet2026!";
async function loadMenu(){
const r=await fetch('/api/menu');menuData=await r.json();cat=Object.keys(menuData)[0];renderCats();renderMenu();
}
function go(s){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
document.getElementById('s-'+s).classList.add('active');
document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.tab===s));
if(s==='cart')renderCart();
if(s==='profile')renderProf();
}
function renderCats(){
document.getElementById('cats').innerHTML=Object.keys(menuData).map(c=>`<button class="cat ${c===cat?'on':''}" onclick="sel('${c}')">${c}</button>`).join('');
}
function sel(c){cat=c;renderCats();renderMenu()}
function renderMenu(){
const items=menuData[cat]||[];
document.getElementById('menu-list').innerHTML=items.map((i,x)=>`
<div class="card" style="animation-delay:${x*.08}s">
<img src="${i.img}">
<div class="cb">
<div><div class="cn">${i.name_ru}</div><div class="cd">${i.desc_ru||''}</div></div>
<div style="display:flex;justify-content:space-between;align-items:center">
<span class="pr">${i.price.toLocaleString()} сум</span>
<button class="plus" onclick="add(${i.id},'${i.name_ru}',${i.price})">+</button>
</div>
</div>
</div>`).join('');
}
function add(id,n,p){
if(!cart[id])cart[id]={name:n,price:p,qty:0};cart[id].qty++;
if(window.Telegram?.WebApp?.HapticFeedback)window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
alert('Добавлено!');
}
function renderCart(){
let h='',t=0;
for(const id in cart){const i=cart[id];t+=i.price*i.qty;
h+=`<div class="cart-row"><div style="flex:1"><div style="font-weight:800;font-size:16px">${i.name}</div><div class="pr">${i.price.toLocaleString()} сум</div>
<div style="display:flex;gap:12px;align-items:center;margin-top:10px">
<button class="qb" onclick="chQty(${id},-1)">-</button><b style="font-size:16px">${i.qty}</b><button class="qb" onclick="chQty(${id},1)">+</button>
</div></div></div>`;}
document.getElementById('cart-list').innerHTML=h||'<p style="text-align:center;padding:40px;color:var(--m)">Корзина пуста</p>';
document.getElementById('total').innerText=t.toLocaleString()+' сум';
let up='';
if(Object.keys(cart).length>0){
let av=[];for(const c in menuData)menuData[c].forEach(i=>{if(!cart[i.id])av.push(i)});
if(av.length>0){const r=av[Math.floor(Math.random()*av.length)];
up=`<div class="up"><div class="upt">🔥 Добавить к заказу?</div>
<div class="upi"><img src="${r.img}" class="uimg"><div><div style="font-weight:800;font-size:14px">${r.name_ru}</div><div class="pr" style="font-size:13px">${r.price.toLocaleString()} сум</div></div>
<button class="upa" onclick="add(${r.id},'${r.name_ru}',${r.price});renderCart()">Добавить</button></div></div>`;}}
document.getElementById('upsell').innerHTML=up;
}
function chQty(id,d){if(!cart[id])return;cart[id].qty+=d;if(cart[id].qty<=0)delete cart[id];renderCart();}
function checkout(){
if(Object.keys(cart).length===0)return alert('Корзина пуста');
if(!prof.name||!prof.phone){alert('Заполните профиль!');return go('profile');}
document.getElementById('o-name').value=prof.name;
document.getElementById('o-phone').value=prof.phone;
document.getElementById('o-addr').value=prof.address||'';
go('checkout');
}
async function submitOrder(){
const n=document.getElementById('o-name').value.trim(),p=document.getElementById('o-phone').value.trim(),a=document.getElementById('o-addr').value.trim();
if(!n||!p||!a)return alert('Заполните все поля');
let items=[],tot=0;for(const id in cart){items.push(cart[id]);tot+=cart[id].price*cart[id].qty;}
const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,phone:p,order_type:'delivery',address:a,items,total:tot})});
if(r.ok){prof={name:n,phone:p,address:a};localStorage.setItem('prof',JSON.stringify(prof));cart={};go('success');if(window.Telegram?.WebApp?.HapticFeedback)window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');}
else alert('Ошибка');
}
function renderProf(){
document.getElementById('p-name').innerText=prof.name||'Гость';
document.getElementById('p-phone').innerText=prof.phone||'Укажите номер';
document.getElementById('p-av').innerText=prof.name?prof.name[0].toUpperCase():'👤';
}
function editProfile(){
document.getElementById('u-name').value=prof.name||'';
document.getElementById('u-phone').value=prof.phone||'';
document.getElementById('u-addr').value=prof.address||'';
document.getElementById('prof-modal').classList.add('show');
}
function saveProf(){
prof.name=document.getElementById('u-name').value.trim();
prof.phone=document.getElementById('u-phone').value.trim();
prof.address=document.getElementById('u-addr').value.trim();
localStorage.setItem('prof',JSON.stringify(prof));
document.getElementById('prof-modal').classList.remove('show');renderProf();
}
function openAdmin(){document.getElementById('pass-modal').classList.add('show');document.getElementById('pass').value='';}
function checkPass(){
if(document.getElementById('pass').value===PASS){document.getElementById('pass-modal').classList.remove('show');go('admin');loadAdminOrders();loadAdminMenu();}
else alert('Неверный пароль!');
}
function switchTab(t){
document.getElementById('admin-orders').style.display=t==='orders'?'block':'none';
document.getElementById('admin-menu').style.display=t==='menu'?'block':'none';
}
async function loadAdminOrders(){
const r=await fetch('/api/orders');const o=await r.json();
if(o.length===0){document.getElementById('admin-orders').innerHTML='<p style="text-align:center;padding:20px">Заказов нет</p>';return;}
document.getElementById('admin-orders').innerHTML=o.reverse().map(x=>`
<div class="card" style="display:block;padding:16px;margin-bottom:10px">
<b>#${x.id}</b> <span style="background:#FEF3C7;color:#B45309;padding:4px 10px;border-radius:20px;font-size:11px;float:right">Новый</span>
<div style="margin-top:12px;font-size:14px">👤 ${x.name}</div>
<div style="margin-top:6px;font-size:14px">📞 ${x.phone}</div>
<div style="margin-top:6px;font-size:14px">📍 ${x.address}</div>
<div style="font-weight:900;color:var(--p);font-size:18px;margin-top:12px">${x.total.toLocaleString()} сум</div>
</div>`).join('');
}
async function loadAdminMenu(){
const r=await fetch('/api/menu');const m=await r.json();let h='';
for(const c in m){h+=`<h3 style="margin:20px 0 10px;color:var(--p)">${c}</h3>`;
m[c].forEach(i=>{h+=`<div class="ai"><div><div style="font-weight:800">${i.name_ru}</div><div style="color:var(--m)">${i.price} сум</div></div>
<div><button class="eb" onclick='openEdit(${JSON.stringify(i).replace(/'/g,"&#39;")},"${c}"}'>✏️</button><button class="db" onclick="delItem(${i.id})">🗑</button></div></div>`;});}
h+=`<button class="btn" style="margin-top:25px" onclick="openEdit(null,'')">+ Добавить</button>`;
document.getElementById('admin-menu').innerHTML=h;
}
function openEdit(i,c){
document.getElementById('edit-modal').classList.add('show');
if(i){document.getElementById('e-id').value=i.id;document.getElementById('e-cat').value=c;document.getElementById('e-name').value=i.name_ru;document.getElementById('e-desc').value=i.desc_ru||'';document.getElementById('e-price').value=i.price;document.getElementById('e-img').value=i.img;}
else{document.getElementById('e-id').value='';document.getElementById('e-cat').value='';document.getElementById('e-name').value='';document.getElementById('e-desc').value='';document.getElementById('e-price').value='';document.getElementById('e-img').value='';}
}
async function saveItem(){
const id=document.getElementById('e-id').value;
const d={id:id||null,cat:document.getElementById('e-cat').value.trim(),name_ru:document.getElementById('e-name').value.trim(),desc_ru:document.getElementById('e-desc').value.trim(),price:parseInt(document.getElementById('e-price').value),img:document.getElementById('e-img').value.trim()};
if(!d.cat||!d.name_ru||!d.price)return alert('Заполните поля');
if(id)await fetch('/api/menu/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
else await fetch('/api/menu/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
document.getElementById('edit-modal').classList.remove('show');loadAdminMenu();loadMenu();
}
async function delItem(id){if(confirm('Удалить?')){await fetch('/api/menu/'+id,{method:'DELETE'});loadAdminMenu();loadMenu();}}
loadMenu();
</script>
</body>
</html>
