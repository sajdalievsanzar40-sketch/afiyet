<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Afiyet Döner Kebap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { 
      --primary: #E85D04; --primary-dark: #C2410C; --primary-soft: #FFF7ED; 
      --bg: #FAF7F2; --card: #FFFFFF; --text: #1A1A1A; --muted: #6B6560; 
      --border: #EDE8E1; --radius: 20px; --shadow: 0 4px 20px rgba(0,0,0,0.06); 
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; overflow-x: hidden; }
    
    /* АНИМАЦИИ */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    
    .screen { display: none; } 
    .screen.active { display: block; animation: fadeUp 0.4s ease forwards; }
    
    /* ШАПКА */
    .hero { background: linear-gradient(145deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 25px 20px 35px; border-radius: 0 0 30px 30px; box-shadow: 0 10px 30px rgba(232,93,4,0.2); }
    .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    
    /* КАТЕГОРИИ */
    .cats { display: flex; gap: 10px; padding: 20px 16px 10px; overflow-x: auto; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat { flex-shrink: 0; padding: 12px 20px; border-radius: 26px; border: 1.5px solid var(--border); background: var(--card); font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .cat.on { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); box-shadow: 0 4px 15px rgba(232,93,4,0.3); }
    
    /* СПИСОК */
    .list { padding: 10px 16px 20px; display: grid; gap: 16px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 12px; display: flex; gap: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); animation: fadeUp 0.4s ease backwards; align-items: center; transition: transform 0.2s; }
    .card:active { transform: scale(0.98); }
    .card img { width: 105px; height: 105px; border-radius: 16px; object-fit: cover; }
    .card-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 105px; padding: 4px 0; }
    .card-name { font-size: 17px; font-weight: 800; }
    .card-desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin: 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price { font-size: 17px; font-weight: 900; color: var(--primary); }
    .plus { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--primary); color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 12px rgba(232,93,4,0.4); }
    .plus:active { transform: scale(0.8); }

    /* КОРЗИНА */
    .cart-row { background: var(--card); border-radius: var(--radius); padding: 16px; display: flex; gap: 14px; box-shadow: var(--shadow); margin-bottom: 12px; animation: fadeUp 0.3s ease; align-items: center; }
    .qty-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--bg); font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); }
    
    /* АПСЕЛЛ (РЕКОМЕНДАЦИИ) */
    .upsell { margin: 0 16px 16px; padding: 18px; background: var(--primary-soft); border-radius: var(--radius); border: 2px dashed var(--primary); animation: pop 0.4s ease; }
    .upsell-title { font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
    .upsell-item { display: flex; align-items: center; gap: 14px; background: white; padding: 12px; border-radius: 16px; box-shadow: var(--shadow); }
    .upsell-img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
    .upsell-add { margin-left: auto; background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 22px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(232,93,4,0.2); }

    /* ФОРМА */
    .form { padding: 20px 16px; animation: fadeUp 0.3s; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field textarea { width: 100%; padding: 16px; border: 1.5px solid var(--border); border-radius: 16px; font-size: 16px; outline: none; background: var(--card); transition: border 0.2s; }
    .field input:focus, .field textarea:focus { border-color: var(--primary); }
    .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 18px; font-size: 17px; font-weight: 800; cursor: pointer; transition: 0.1s; box-shadow: 0 6px 20px rgba(232,93,4,0.3); }
    .btn-main:active { transform: scale(0.95); }
    
    /* ПРОФИЛЬ */
    .profile-head { background: linear-gradient(145deg, var(--primary), var(--primary-dark)); color: white; padding: 35px 20px; border-radius: 0 0 30px 30px; text-align: center; box-shadow: 0 10px 30px rgba(232,93,4,0.2); }
    .avatar { width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 15px; border: 3px solid rgba(255,255,255,0.4); animation: pulse 3s infinite; }
    .menu-row { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--border); cursor: pointer; background: var(--card); transition: background 0.2s; }
    .menu-row:active { background: var(--bg); }
    .menu-icon { font-size: 22px; margin-right: 16px; }
    
    /* НАВИГАЦИЯ (СТЕКЛО) */
    .nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: none; background: none; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .nav-item.on { color: var(--primary); transform: translateY(-2px); }
    .nav-icon { font-size: 24px; }
    
    /* МОДАЛЬНЫЕ ОКНА */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
    .modal.show { display: flex; }
    .modal-box { background: white; padding: 25px 20px 35px; border-radius: 30px 30px 0 0; width: 100%; animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1); max-height: 90vh; overflow-y: auto; }
    
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .edit-btn { background: #FEF3C7; color: #B45309; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 14px; }
    .del-btn { background: #FEE2E2; color: #B91C1C; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 14px; }
    
    /* ЭКРАН УСПЕХА */
    .success-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; padding: 20px; }
    .success-icon { font-size: 80px; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- МЕНЮ -->
  <div id="s-menu" class="screen active">
    <div class="hero"><h1>Afiyet Döner</h1><p style="opacity:0.85; font-size:14px; margin-top:6px; font-weight:500;">Халяль · 9:00 – 00:00</p></div>
    <div class="cats" id="cats"></div>
    <div class="list" id="menu-list"></div>
  </div>

  <!-- КОРЗИНА -->
  <div id="s-cart" class="screen">
    <div class="hero" style="padding:20px; border-radius:0 0 24px 24px;"><h1 style="font-size:20px;">Ваш заказ</h1></div>
    <div class="list" id="cart-list"></div>
    <div id="upsell-container"></div>
    <div style="padding:16px; margin-top:auto;">
      <div style="display:flex; justify-content:space-between; font-size:22px; font-weight:900; margin-bottom:20px;"><span>Итого:</span><span id="cart-total" style="color:var(--primary)">0 сум</span></div>
      <button class="btn-main" onclick="goCheckout()">Оформить заказ</button>
    </div>
  </div>

  <!-- ОФОРМЛЕНИЕ -->
  <div id="s-checkout" class="screen">
    <div class="hero" style="padding:20px; border-radius:0 0 24px 24px;"><h1 style="font-size:20px;">Куда доставить?</h1></div>
    <div class="form">
      <div class="field"><label>Имя</label><input type="text" id="order-name" placeholder="Ваше имя" /></div>
      <div class="field"><label>Телефон</label><input type="tel" id="order-phone" placeholder="+998 90 123 45 67" /></div>
      <div class="field"><label>Адрес доставки</label><textarea id="order-address" rows="2" placeholder="Улица, дом, квартира"></textarea></div>
      <button class="btn-main" onclick="submitOrder()">Подтвердить заказ</button>
    </div>
  </div>

  <!-- УСПЕХ -->
  <div id="s-success" class="screen">
    <div class="success-screen">
      <div class="success-icon">🎉</div>
      <h1 style="font-size:28px; font-weight:900; margin-bottom:10px;">Заказ принят!</h1>
      <p style="color:var(--muted); font-size:16px; margin-bottom:30px;">Мы уже начали готовить.<br>Ожидайте звонка оператора.</p>
      <button class="btn-main" style="max-width:250px;" onclick="go('menu')">Вернуться в меню</button>
    </div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div id="s-profile" class="screen">
    <div class="profile-head">
      <div class="avatar" id="prof-avatar">👤</div>
      <div style="font-size:24px; font-weight:900;" id="prof-name">Гость</div>
      <div style="font-size:15px; opacity:0.9; margin-top:6px;" id="prof-phone">Укажите номер</div>
    </div>
    <div style="margin-top:25px; background:var(--card); border-top:1px solid var(--border);">
      <div class="menu-row" onclick="editProfile()">
        <span class="menu-icon">✏️</span> <span style="font-weight:700;">Редактировать профиль</span>
      </div>
      <div class="menu-row" style="justify-content:center; padding:35px; opacity:0.3;" onclick="openAdminLogin()">
        <span style="font-size:12px; font-weight:600;">⚙️ Для сотрудников</span>
      </div>
    </div>
  </div>

  <!-- АДМИНКА -->
  <div id="s-admin" class="screen">
    <div class="hero" style="padding:20px; display:flex; justify-content:space-between; align-items:center; border-radius:0 0 24px 24px;">
      <h1 style="font-size:20px;">Админ-панель</h1>
      <button onclick="go('profile')" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">✕</button>
    </div>
    <div class="list">
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <button class="btn-main" style="flex:1; padding:14px; font-size:15px;" onclick="switchAdminTab('orders')">Заказы</button>
        <button class="btn-main" style="flex:1; padding:14px; font-size:15px; background:var(--card); color:var(--text); border:1px solid var(--border);" onclick="switchAdminTab('menu')">Меню</button>
      </div>
      <div id="admin-orders"></div>
      <div id="admin-menu" style="display:none;"></div>
    </div>
  </div>

  <!-- МОДАЛКА ПАРОЛЯ -->
  <div id="pass-modal" class="modal">
    <div class="modal-box" style="text-align:center;">
      <h2 style="margin-bottom: 20px; font-weight:800;">Вход для Админа</h2>
      <input type="password" id="admin-pass" placeholder="Пароль" style="width:100%; padding:16px; border:2px solid var(--border); border-radius:16px; font-size:18px; text-align:center; margin-bottom:20px; outline:none;" />
      <button class="btn-main" onclick="checkAdminPass()">Войти</button>
      <button style="background:none; border:none; color:var(--muted); margin-top:20px; font-size:15px; font-weight:700;" onclick="document.getElementById('pass-modal').classList.remove('show')">Отмена</button>
    </div>
  </div>

  <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
  <div id="edit-modal" class="modal">
    <div class="modal-box">
      <h2 style="margin-bottom: 20px; text-align:center; font-weight:800;">Изменить блюдо</h2>
      <div class="field"><label>Категория</label><input type="text" id="edit-cat" /></div>
      <div class="field"><label>Название</label><input type="text" id="edit-name" /></div>
      <div class="field"><label>Описание</label><input type="text" id="edit-desc" /></div>
      <div class="field"><label>Цена (сум)</label><input type="number" id="edit-price" /></div>
      <div class="field"><label>Ссылка на фото</label><input type="text" id="edit-img" /></div>
      <input type="hidden" id="edit-id" />
      <button class="btn-main" onclick="saveMenuItem()">Сохранить</button>
    </div>
  </div>

  <!-- МОДАЛКА ПРОФИЛЯ -->
  <div id="prof-modal" class="modal">
    <div class="modal-box">
      <h2 style="margin-bottom: 20px; text-align:center; font-weight:800;">Мои данные</h2>
      <div class="field"><label>Имя</label><input type="text" id="edit-prof-name" placeholder="Ваше имя" /></div>
      <div class="field"><label>Телефон</label><input type="tel" id="edit-prof-phone" placeholder="+998..." /></div>
      <div class="field"><label>Адрес по умолчанию</label><input type="text" id="edit-prof-address" placeholder="Улица, дом..." /></div>
      <button class="btn-main" onclick="saveProfile()">Сохранить</button>
    </div>
  </div>

  <!-- НАВИГАЦИЯ -->
  <nav class="nav" id="nav">
    <button class="nav-item on" data-tab="menu" onclick="go('menu')"><span class="nav-icon">🍽</span>Меню</button>
    <button class="nav-item" data-tab="cart" onclick="go('cart')"><span class="nav-icon">🛒</span>Корзина</button>
    <button class="nav-item" data-tab="profile" onclick="go('profile')"><span class="nav-icon">👤</span>Профиль</button>
  </nav>

  <script>
    let cart = {};
    let menuData = {};
    let currentCat = '';
    const ADMIN_PASSWORD = "Afiyet2026!";
    let profile = JSON.parse(localStorage.getItem('afiyet_profile')) || { name: '', phone: '', address: '' };

    // --- ЗАГРУЗКА МЕНЮ ---
    async function loadMenu() {
      const res = await fetch('/api/menu');
      menuData = await res.json();
      currentCat = Object.keys(menuData)[0];
      renderCats();
      renderMenu();
    }

    // --- НАВИГАЦИЯ ---
    function go(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('s-' + screen).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('on', n.dataset.tab === screen));
      if (screen === 'cart') renderCart();
      if (screen === 'profile') renderProfile();
    }

    // --- КАТЕГОРИИ И МЕНЮ ---
    function renderCats() {
      document.getElementById('cats').innerHTML = Object.keys(menuData).map(c => 
        `<button class="cat ${c === currentCat ? 'on' : ''}" onclick="selectCat('${c}')">${c}</button>`
      ).join('');
    }

    function selectCat(c) { 
      currentCat = c; 
      renderCats(); 
      renderMenu(); 
    }

    function renderMenu() {
      const items = menuData[currentCat] || [];
      document.getElementById('menu-list').innerHTML = items.map((item, index) => `
        <div class="card" style="animation-delay: ${index * 0.08}s">
          <img src="${item.img}" />
          <div class="card-body">
            <div><div class="card-name">${item.name_ru}</div><div class="card-desc">${item.desc_ru || ''}</div></div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="price">${item.price.toLocaleString()} сум</span>
              <button class="plus" onclick="add(${item.id}, '${item.name_ru}', ${item.price})">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function add(id, name, price) {
      if (!cart[id]) cart[id] = { name, price, qty: 0 };
      cart[id].qty++;
      if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      // Маленький визуальный отклик
      alert('Добавлено!'); 
    }

    // --- КОРЗИНА ---
    function renderCart() {
      let html = '', total = 0;
      for (const id in cart) {
        const i = cart[id]; total += i.price * i.qty;
        html += `<div class="cart-row"><div style="flex:1;"><div style="font-weight:800; font-size:16px;">${i.name}</div><div class="price">${i.price.toLocaleString()} сум</div>
          <div style="display:flex; gap:12px; align-items:center; margin-top:10px;">
            <button class="qty-btn" onclick="changeQty(${id},-1)">-</button><b style="font-size:16px;">${i.qty}</b><button class="qty-btn" onclick="changeQty(${id},1)">+</button>
          </div></div></div>`;
      }
      document.getElementById('cart-list').innerHTML = html || '<p style="text-align:center; padding:40px; color:var(--muted); font-size:16px;">Корзина пока пуста</p>';
      document.getElementById('cart-total').innerText = total.toLocaleString() + ' сум';
      
      // Рекомендации
      let upHtml = '';
      if (Object.keys(cart).length > 0) {
        const available = [];
        for (const c in menuData) {
          menuData[c].forEach(item => {
            if (!cart[item.id]) available.push(item);
          });
        }
        if (available.length > 0) {
          const rec = available[Math.floor(Math.random() * available.length)];
          upHtml = `<div class="upsell">
            <div class="upsell-title">🔥 Добавить к заказу?</div>
            <div class="upsell-item">
              <img src="${rec.img}" class="upsell-img" />
              <div>
                <div style="font-weight:800; font-size:14px;">${rec.name_ru}</div>
                <div class="price" style="font-size:13px;">${rec.price.toLocaleString()} сум</div>
              </div>
              <button class="upsell-add" onclick="add(${rec.id}, '${rec.name_ru}', ${rec.price}); renderCart();">Добавить</button>
            </div>
          </div>`;
        }
      }
      document.getElementById('upsell-container').innerHTML = upHtml;
    }

    function changeQty(id, d) {
      if (!cart[id]) return;
      cart[id].qty += d;
      if (cart[id].qty <= 0) delete cart[id];
      renderCart();
    }

    function goCheckout() {
      if (Object.keys(cart).length === 0) return alert('Корзина пуста');
      if (!profile.name || !profile.phone) {
        alert('Пожалуйста, сначала заполните профиль!');
        return go('profile');
      }
      document.getElementById('order-name').value = profile.name;
      document.getElementById('order-phone').value = profile.phone;
      document.getElementById('order-address').value = profile.address || '';
      go('checkout');
    }

    async function submitOrder() {
      const name = document.getElementById('order-name').value.trim();
      c
