<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Afiyet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--p:#E85D04;--pd:#C2410C;--bg:#FAF7F2;--c:#FFF;--t:#1A1A1A;--m:#6B6560;--b:#EDE8E1;--r:20px;--s:0 4px 20px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,sans-serif}
body{background:var(--bg);color:var(--t);padding-bottom:90px;overflow-x:hidden}
@keyframes f{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes s{from{transform:translateY(100%)}to{transform:translateY(0)}}
.screen{display:none}.screen.active{display:block;animation:f .4s ease forwards}
.hero{background:linear-gradient(145deg,var(--p),var(--pd));color:#fff;padding:25px 20px 35px;border-radius:0 0 30px 30px;position:relative}
.hero h1{font-size:26px;font-weight:800}
.lang-btn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:12px;font-weight:700;cursor:pointer}
.cats{display:flex;gap:10px;padding:20px 16px 10px;overflow-x:auto;scrollbar-width:none}
.cat{flex-shrink:0;padding:12px 20px;border-radius:26px;border:1.5px solid var(--b);background:var(--c);font-size:14px;font-weight:700;color:var(--m);cursor:pointer;transition:.3s}
.cat.on{background:var(--p);color:#fff;border-color:var(--p)}
.list{padding:10px 16px 20px;display:grid;gap:16px}
.card{background:var(--c);border-radius:var(--r);padding:12px;display:flex;gap:14px;box-shadow:var(--s);border:1px solid var(--b);animation:f .4s ease backwards;align-items:center}
.card img{width:105px;height:105px;border-radius:16px;object-fit:cover}
.cb{flex:1;display:flex;flex-direction:column;justify-content:space-between;height:105px;padding:4px 0}
.cn{font-size:17px;font-weight:800}
.cd{font-size:12px;color:var(--m);line-height:1.4;margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:17px;font-weight:900;color:var(--p)}
.plus{width:40px;height:40px;border-radius:50%;border:none;background:var(--p);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cart-row{background:var(--c);border-radius:var(--r);padding:16px;display:flex;gap:14px;box-shadow:var(--s);margin-bottom:12px;align-items:center}
.qb{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--b);background:var(--bg);font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer}
.up{margin:0 16px 16px;padding:18px;background:#FFF7ED;border-radius:var(--r);border:2px dashed var(--p)}
.upt{font-size:14px;font-weight:800;color:var(--p);margin-bottom:12px}
.upi{display:flex;align-items:center;gap:14px;background:#fff;padding:12px;border-radius:16px;box-shadow:var(--s)}
.uimg{width:60px;height:60px;border-radius:12px;object-fit:cover}
.upa{margin-left:auto;background:var(--p);color:#fff;border:none;padding:10px 16px;border-radius:22px;font-size:14px;font-weight:800;cursor:pointer}
.form{padding:20px 16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--m);margin-bottom:8px}
.field input,.field textarea{width:100%;padding:16px;border:1.5px solid var(--b);border-radius:16px;font-size:16px;outline:none;background:var(--c)}
.btn{width:100%;background:var(--p);color:#fff;border:none;padding:18px;border-radius:18px;font-size:17px;font-weight:800;cursor:pointer}
.ph{background:linear-gradient(145deg,var(--p),var(--pd));color:#fff;padding:35px 20px;border-radius:0 0 30px 30px;text-align:center}
.av{width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 15px;border:3px solid rgba(255,255,255,.4)}
.mr{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--b);cursor:pointer;background:var(--c)}
.mi{font-size:22px;margin-right:16px}
.nav{position:fixed;bottom:0;width:100%;height:80px;background:rgba(255,255,255,.95);border-top:1px solid var(--b);display:flex;z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:none;background:none;color:var(--m);font-size:11px;font-weight:700;cursor:pointer}
.ni.on{color:var(--p)}
.nicon{font-size:24px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal.show{display:flex}
.mbox{background:#fff;padding:25px 20px 35px;border-radius:30px 30px 0 0;width:100%;animation:s .3s ease;max-height:90vh;overflow-y:auto}
.ai{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--b)}
.eb{background:#FEF3C7;color:#B45309;border:none;padding:8px 14px;border-radius:12px;font-weight:800;cursor:pointer}
.db{background:#FEE2E2;color:#B91C1C;border:none;padding:8px 14px;border-radius:12px;font-weight:800;cursor:pointer}
.success{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;text-align:center;padding:20px}
.sicon{font-size:80px;margin-bottom:20px}
.status-badge{font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;display:inline-block;margin-bottom:10px}
.st-new{background:#FEF3C7;color:#B45309}
.st-preparing{background:#DBEAFE;color:#1D4ED8}
.st-delivering{background:#E0E7FF;color:#4338CA}
.st-done{background:#D1FAE5;color:#047857}
</style>
</head>
<body>
<div id="s-menu" class="screen active">
<div class="hero"><h1 data-i18n="title">Afiyet Döner</h1><p data-i18n="subtitle" style="opacity:.85;font-size:14px;margin-top:6px">Халяль · 9:00 – 00:00</p><button class="lang-btn" onclick="changeLang()">RU</button></div>
<div class="cats" id="cats"></div><div class="list" id="menu-list"></div>
</div>
<div id="s-cart" class="screen">
<div class="hero" style="padding:20px;border-radius:0 0 24px 24px"><h1 style="font-size:20px" data-i18n="cart">Ваш заказ</h1></div>
<div class="list" id="cart-list"></div><div id="upsell"></div>
<div style="padding:16px"><div style="display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin-bottom:20px"><span data-i18n="total">Итого:</span><span id="total" style="color:var(--p)">0 сум</span></div><button class="btn" onclick="checkout()" data-i18n="checkout">Оформить заказ</button></div>
</div>
<div id="s-checkout" class="screen">
<div class="hero" style="padding:20px;border-radius:0 0 24px 24px"><h1 style="font-size:20px" data-i18n="where">Куда доставить?</h1></div>
<div class="form">
<div class="field"><label data-i18n="name">Имя</label><input type="text" id="o-name"></div>
<div class="field"><label data-i18n="phone">Телефон</label><input type="tel" id="o-phone"></div>
<div class="field"><label data-i18n="address">Адрес</label><textarea id="o-addr" rows="2"></textarea></div>
<button class="btn" onclick="submitOrder()" data-i18n="confirm">Подтвердить заказ</button>
</div>
</div>
<div id="s-success" class="screen">
<div class="success"><div class="sicon">🎉</div><h1 style="font-size:28px;font-weight:900;margin-bottom:10px" data-i18n="accepted">Заказ принят!</h1><p style="color:var(--m);font-size:16px;margin-bottom:30px" data-i18n="cooking">Мы уже начали готовить.</p><button class="btn" style="max-width:250px" onclick="go('menu')" data-i18n="back">Вернуться в меню</button></div>
</div>
<div id="s-profile" class="screen">
<div class="ph"><div class="av" id="p-av">👤</div><div style="font-size:24px;font-weight:900" id="p-name">Гость</div><div style="font-size:15px;opacity:.9;margin-top:6px" id="p-phone">Укажите номер</div></div>
<div style="margin-top:25px;background:var(--c);border-top:1px solid var(--b)">
<div class="mr" onclick="editProfile()"><span class="mi">✏️</span><span style="font-weight:700" data-i18n="editProfile">Редактировать профиль</span></div>
<div class="mr" onclick="go('orders')"><span class="mi">📦</span><span style="font-weight:700" data-i18n="myOrders">Мои заказы</span></div>
<div class="mr" style="justify-content:center;padding:35px;opacity:.3" onclick="openAdmin()"><span style="font-size:12px;font-weight:600" data-i18n="forStaff">⚙️ Для сотрудников</span></div>
</div>
</div>
<div id="s-orders" class="screen">
<div class="hero" style="padding:20px;border-radius:0 0 24px 24px;display:flex;align-items:center;gap:10px"><button onclick="go('profile')" style="background:none;border:none;color:#fff;font-size:24px">←</button><h1 style="font-size:20px" data-i18n="myOrders">Мои заказы</h1></div>
<div class="list" id="my-orders-list"></div>
</div>
<div id="s-admin" class="screen">
<div class="hero" style="padding:20px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 24px 24px"><h1 style="font-size:20px" data-i18n="adminPanel">Админ-панель</h1><button onclick="go('profile')" style="background:none;border:none;color:#fff;font-size:24px">✕</button></div>
<div class="list">
<div style="display:flex;gap:10px;margin-bottom:10px"><button class="btn" style="flex:1;padding:14px;font-size:15px" onclick="switchTab('orders')" data-i18n="orders">Заказы</button><button class="btn" style="flex:1;padding:14px;font-size:15px;background:#fff;color:#1A1A1A;border:1px solid var(--b)" onclick="switchTab('menu')" data-i18n="menu">Меню</button></div>
<div id="admin-orders"></div><div id="admin-menu" style="display:none"></div>
</div>
</div>
<div id="pass-modal" class="modal"><div class="mbox" style="text-align:center">
<h2 style="margin-bottom:20px" data-i18n="adminLogin">Вход для Админа</h2>
<input type="password" id="pass" placeholder="Пароль" style="width:100%;padding:16px;border:2px solid var(--b);border-radius:16px;font-size:18px;text-align:center;margin-bottom:20px;outline:none">
<button class="btn" onclick="checkPass()" data-i18n="login">Войти</button>
<button style="background:none;border:none;color:var(--m);margin-top:20px;font-size:15px;font-weight:700" onclick="document.getElementById('pass-modal').classList.remove('show')" data-i18n="cancel">Отмена</button>
</div></div>
<div id="edit-modal" class="modal"><div class="mbox">
<h2 style="margin-bottom:20px;text-align:center" data-i18n="dish">Блюдо</h2>
<div class="field"><label data-i18n="category">Категория</label><input type="text" id="e-cat"></div>
<div class="field"><label data-i18n="name">Название</label><input type="text" id="e-name"></div>
<div class="field"><label data-i18n="desc">Описание</label><input type="text" id="e-desc"></div>
<div class="field"><label data-i18n="price">Цена</label><input type="number" id="e-price"></div>
<div class="field"><label data-i18n="photo">Фото</label><input type="text" id="e-img"></div>
<input type="hidden" id="e-id"><button class="btn" onclick="saveItem()" data-i18n="save">Сохранить</button>
</div></div>
<div id="prof-modal" class="modal"><div class="mbox">
<h2 style="margin-bottom:20px;text-align:center" data-i18n="myData">Мои данные</h2>
<div class="field"><label data-i18n="name">Имя</label><input type="text" id="u-name"></div>
<div class="field"><label data-i18n="phone">Телефон</label><input type="tel" id="u-phone"></div>
<div class="field"><label data-i18n="address">Адрес</label><input type="text" id="u-addr"></div>
<button class="btn" onclick="saveProf()" data-i18n="save">Сохранить</button>
</div></div>
<nav class="nav" id="nav">
<button class="ni on" data-tab="menu" onclick="go('menu')"><span class="nicon">🍽</span><span data-i18n="menu">Меню</span></button>
<button class="ni" data-tab="cart" onclick="go('cart')"><span class="nicon">🛒</span><span data-i18n="cart">Корзина</span></button>
<button class="ni" data-tab="profile" onclick="go('profile')"><span class="nicon">👤</span><span data-i18n="profile">Профиль</span></button>
</nav>
<script>
const tg = window.Telegram?.WebApp;
const tgUser = tg?.initDataUnsafe?.user;
const uid = tgUser ? tgUser.id : 'guest'; 
const profKey = 'prof_' + uid; 

const i18n = {
  ru: { title:"Afiyet Döner", subtitle:"Халяль · 9:00 – 00:00", cart:"Корзина", total:"Итого:", checkout:"Оформить заказ", where:"Куда доставить?", name:"Имя", phone:"Телефон", address:"Адрес", confirm:"Подтвердить заказ", accepted:"Заказ принят!", cooking:"Мы уже начали готовить.", back:"Вернуться в меню", guest:"Гость", phoneHint:"Укажите номер", editProfile:"Редактировать профиль", myOrders:"Мои заказы", forStaff:"⚙️ Для сотрудников", adminPanel:"Админ-панель", orders:"Заказы", menu:"Меню", adminLogin:"Вход для Админа", login:"Войти", cancel:"Отмена", dish:"Блюдо", category:"Категория", desc:"Описание", price:"Цена", photo:"Фото", save:"Сохранить", myData:"Мои данные", profile:"Профиль" },
  uz: { title:"Afiyet Döner", subtitle:"Halol · 9:00 – 00:00", cart:"Savat", total:"Jami:", checkout:"Buyurtma berish", where:"Qayerga yetkazamiz?", name:"Ism", phone:"Telefon", address:"Manzil", confirm:"Buyurtmani tasdiqlash", accepted:"Buyurtma qabul qilindi!", cooking:"Tayyorlashni boshladik.", back:"Menyuga qaytish", guest:"Mehmon", phoneHint:"Raqamni kiriting", editProfile:"Profilni tahrirlash", myOrders:"Mening buyurtmalarim", forStaff:"⚙️ Xodimlar uchun", adminPanel:"Admin panel", orders:"Buyurtmalar", menu:"Menyu", adminLogin:"Admin kirish", login:"Kirish", cancel:"Bekor qilish", dish:"Taom", category:"Kategoriya", desc:"Tavsif", price:"Narx", photo:"Rasm", save:"Saqlash", myData:"Mening ma'lumotlarim", profile:"Profil" },
  en: { title:"Afiyet Döner", subtitle:"Halal · 9:00 – 00:00", cart:"Cart", total:"Total:", checkout:"Checkout", where:"Where to deliver?", name:"Name", phone:"Phone", address:"Address", confirm:"Confirm order", accepted:"Order accepted!", cooking:"We have started cooking.", back:"Back to menu", guest:"Guest", phoneHint:"Enter number", editProfile:"Edit profile", myOrders:"My orders", forStaff:"⚙️ For staff", adminPanel:"Admin panel", orders:"Orders", menu:"Menu", adminLogin:"Admin login", login:"Login", cancel:"Cancel", dish:"Dish", category:"Category", desc:"Description", price:"Price", photo:"Photo", save:"Save", myData:"My data", profile:"Profile" }
};

let lang = localStorage.getItem('lang_'+uid) || 'ru';
let cart={},menuData={},cat='',prof=JSON.parse(localStorage.getItem(profKey))||{name:'',phone:'',address:''};
const PASS="Afiyet2026!";

function t(key) { return i18n[lang][key] || key; }

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t(el.getAttribute('data-i18n')); });
  document.querySelector('.lang-btn').innerText = lang.toUpperCase();
}

function changeLang() {
  lang = lang === 'ru' ? 'uz' : lang === 'uz' ? 'en' : 'ru';
  localStorage.setItem('lang_'+uid, lang);
  applyLang(); renderCats(); renderMenu();
  if(document.getElementById('s-cart').classList.contains('active')) renderCart();
  if(document.getElementById('s-profile').classList.contains('active')) renderProf();
}

async function loadMenu(){
  try {
    const r = await fetch('/api/menu'); 
    menuData = await r.json(); 
    cat = Object.keys(menuData)[0]; 
    renderCats(); 
    renderMenu();
  } catch(e) { console.error("Ошибка загрузки меню", e); }
}

function go(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('s-'+s).classList.add('active');
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.tab===s));
  if(s==='cart')renderCart(); if(s==='profile')renderProf(); if(s==='orders')loadMyOrders();
}

function renderCats(){
  document.getElementById('cats').innerHTML=Object.keys(menuData).map(c=>`<button class="cat ${c===cat?'on':''}" onclick="sel('${c}')">${c}</button>`).join('');
}

function sel(c){cat=c;renderCats();renderMenu()}

function renderMenu(){
  const items=menuData[cat]||[];
  document.getElementById('menu-list').innerHTML=items.map((i,x)=>`
  <div class="card" style="animation-delay:${x*.08}s">
  <img src="${i.img}">
  <div class="cb">
  <div><div class="cn">${i.name_ru}</div><div class="cd">${i.desc_ru||''}</div></div>
  <div style="display:flex;justify-content:space-between;align-items:center">
  <span class="pr">${i.price.toLocaleString()} сум</span>
  <button class="plus" onclick="add(${i.id},'${i.name_ru}',${i.price})">+</button>
  </div></div></div>`).join('');
}

function add(id,n,p){
  if(!cart[id])cart[id]={name:n,price:p,qty:0};cart[id].qty++;
  if(window.Telegram?.WebApp?.HapticFeedback)window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
}

function renderCart(){
  let h='',t=0;
  for(const id in cart){const i=cart[id];t+=i.price*i.qty;
  h+=`<div class="cart-row"><div style="flex:1"><div style="font-weight:800;font-size:16px">${i.name}</div><div class="pr">${i.price.toLocaleString()} сум</div>
  <div style="display:flex;gap:12px;align-items:center;margin-top:10px">
  <button class="qb" onclick="chQty(${id},-1)">-</button><b style="font-size:16px">${i.qty}</b><button class="qb" onclick="chQty(${id},1)">+</button>
  </div></div></div>`;}
  document.getElementById('cart-list').innerHTML=h||`<p style="text-align:center;padding:40px;color:var(--m)">${t('cart')} empty</p>`;
  document.getElementById('total').innerText=t.toLocaleString()+' сум';
  
  let up='';
  if(Object.keys(cart).length>0){
    let av=[];for(const c in menuData)menuData[c].forEach(i=>{if(!cart[i.id])av.push(i)});
    if(av.length>0){
      const r=av[Math.floor(Math.random()*av.length)];
      up=`<div class="up"><div class="upt">🔥 ${lang==='ru'?'Добавить к заказу?':lang==='uz'?'Qo\'shasizmi?':'Add to order?'}</div>
      <div class="upi"><img src="${r.img}" class="uimg"><div><div style="font-weight:800;font-size:14px">${r.name_ru}</div><div class="pr" style="font-size:13px">${r.price.toLocaleString()} сум</div></div>
      <button class="upa" onclick="add(${r.id},'${r.name_ru}',${r.price});renderCart()">${lang==='ru'?'Добавить':lang==='uz'?'Qo\'shish':'Add'}</button></div></div>`;
    }
  }
  document.getElementById('upsell').innerHTML=up;
}

function chQty(id,d){if(!cart[id])return;cart[id].qty+=d;if(cart[id].qty<=0)delete cart[id];renderCart();}

function checkout(){
  if(Object.keys(cart).length===0)return alert('Корзина пуста');
  if(!prof.name||!prof.phone){alert('Заполните профиль!');return go('profile');}
  document.getElementById('o-name').value=prof.name;
  document.getElementById('o-phone').value=prof.phone;
  document.getElementById('o-addr').value=prof.address||'';
  go('checkout');
}

async function submitOrder(){
  const n=document.getElementById('o-name').value.trim(),p=document.getElementById('o-phone').value.trim(),a=document.getElementById('o-addr').value.trim();
  if(!n||!p||!a)return alert('Заполните все поля');
  let items=[],tot=0;for(const id in cart){items.push(cart[id]);tot+=cart[id].price*cart[id].qty;}
  const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,phone:p,order_type:'delivery',address:a,items,total:tot,uid:uid})});
  if(r.ok){prof={name:n,phone:p,address:a};localStorage.setItem(profKey,JSON.stringify(prof));cart={};go('success');}
  else alert('Ошибка');
}

function renderProf(){
  document.getElementById('p-name').innerText=prof.name||t('guest');
  document.getElementById('p-phone').innerText=prof.phone||t('phoneHint');
  document.getElementById('p-av').innerText=prof.name?prof.name[0].toUpperCase():'👤';
}

function editProfile(){
  document.getElementById('u-name').value=prof.name||'';
  document.getElementById('u-phone').value=prof.phone||'';
  document.getElementById('u-addr').value=prof.address||'';
  document.getElementById('prof-modal').classList.add('show');
}

function saveProf(){
  prof.name=document.getElementById('u-name').value.trim();
  prof.phone=document.getElementById('u-phone').value.trim();
  prof.address=document.getElementById('u-addr').value.trim();
  localStorage.setItem(profKey,JSON.stri
